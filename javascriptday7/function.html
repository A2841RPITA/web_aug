<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions</title>
</head>

<body>

    <script>

        // Functions - Are used to do a Specific Task


        // 1. Function keyword
        // Symbol functionname()

        function Greet() {

            // Body - Instruction of Task

            console.log("Good Evening user");

        }

        // Calling the Function - To do the task

        Greet();


        // 2. Function with parameter

        function Greeting(name) {

            console.log("Good Evening " + name);

        }

        Greeting("Aman");

        Greeting("Bhavana");

        Greeting("Thaha");


        // 3. Function with return keyword

        function Add(a, b) {

            return a + b;

        }

        Add(10, 5);

    </script>

</body>

</html>
