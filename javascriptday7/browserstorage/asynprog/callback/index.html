<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // CALLBACK : CALLBACK IS FUNCTION AND IT IS PASSED AS PARAMETER INTO ANOTHER FUNCTION (callback)

        function DoHomework(subject, callback) {
            console.log(`Doing Home Work for ${subject}`)
        }

        DoHomework("Maths", function() {
            console.log("Home Work Done")
        })

    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // CALLBACK : CALLBACK IS FUNCTION AND IT IS PASSED AS PARAMETER
        // INTO ANOTHER FUNCTION (callback)

        function DoHomeWork(subject, callback) {

            console.log(`Doing Home Work for ${subject}`)

            callback()   // Calling a callback function
        }

        DoHomeWork("Maths", function() {
            console.log("Home Work Done")
        })

    </script>
</body>
</html>
