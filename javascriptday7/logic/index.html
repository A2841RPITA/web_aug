<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Number Game</title>
</head>
<body>

    <script>

        let luckyNo = Math.floor(Math.random() * 6) + 1;
        // console.log(luckyNo);

        while (true) {

            let guessNo = prompt("Enter your No Between 1 - 6");

            // Winning Condition
            if (luckyNo == guessNo) {

                alert("You Won The Game");
                break;

            } else {

                alert("Better Luck Next Time");

            }

        }

    </script>

</body>
</html>
