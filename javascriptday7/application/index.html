
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Logic</title>
</head>
<body>

    <script>

        // 1. Logic of Finding Even and Odd Number

        let num = Number(prompt("Enter a number"));

        if (num % 2 == 0) {
            console.log(num + " is Even");
        } else {
            console.log(num + " is Odd");
        }


        // 2. Logic of Finding Prime Number

        let n = Number(prompt("Enter a number to check Prime"));

        let isPrime = true;

        if (n <= 1) {
            isPrime = false;
        } else {
            for (let i = 2; i < n; i++) {
                if (n % i == 0) {
                    isPrime = false;
                    break;
                }
            }
        }

        if (isPrime) {
            console.log(n + " is Prime");
        } else {
            console.log(n + " is Not Prime");
        }


        // 3. Logic of Sum of 1, 2, 3, 4, 5

        let sum = 0;

        for (let i = 1; i <= 5; i++) {
            sum = sum + i;
        }

        console.log("Sum =", sum);


        // 4. Logic of Finding Reverse
        // Example: hello -> olleh

        let word = prompt("Enter a word");

        let reverse = "";

        for (let i = word.length - 1; i >= 0; i--) {
            reverse = reverse + word[i];
        }

        console.log("Reverse =", reverse);

    </script>

</body>
</html>
