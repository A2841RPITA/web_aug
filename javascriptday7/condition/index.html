<!DOCTYPE html>
<html lang="en">
<body>

    <script>
        // else if

        let amount = 209.99;

        if (amount >= 500) {
            alert('Free Delivery');
        }
        else if (amount >= 400) {
            // amount is 400 and 499 - 30 Rs Delivery
            alert('Rs 30 Delivery Charges Applied');
        }
        else if (amount >= 300) {
            alert('Rs 50 Delivery Charges Applied');
        }
        else {
            alert('Cannot Place Order Below 300');
        }

    </script>

</body>
</html>
