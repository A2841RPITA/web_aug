<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Functions</title>
</head>
<body>

    <script>

        // Math.pow - Returns the power of a number

        console.log(Math.pow(2, 4)); // 16


        // Logic

        console.log(Math.random()); // By Default in range of 0 - 1


        // Floor - It will remove the decimal number
        // 4.8 --> 4

        console.log(Math.floor(4.8)); // 4
        console.log(Math.floor(2.1)); // 2


        // Ceil - It converts to next higher whole number
        // 4.2 --> 5

        console.log(Math.ceil(3.1)); // 4
        console.log(Math.ceil(5.7)); // 6


        // Round - If decimal number < 0.5, remove decimal
        // If decimal number is > 0.5 or == 0.5,
        // next higher whole number

        console.log(Math.round(6.4)); // 6
        console.log(Math.round(6.5)); // 7
        console.log(Math.round(6.6)); // 7

    </script>

</body>
</html>
