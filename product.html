<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 38px 24px;
            padding: 40px 35px;
        }

        .box {
            background-color: white;
            border: 1px solid black;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 3px 5px 8px gray;
            height: 340px;
        }

        .box img {
            width: 100%;
            height: 158px;
            object-fit: cover;
            border-radius: 12px;
        }

        .box h2 {
            margin-top: 20px;
            font-size: 24px;
        }

        .price {
            margin-top: 18px;
            font-size: 15px;
        }

        .box button {
            width: 90%;
            height: 35px;
            margin-top: 18px;
            background-color: orange;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .box button:hover {
            background-color: darkorange;
        }
    </style>
</head>

<body>

    <div class="products">

        <div class="box">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
            <h2>Headphone</h2>
            <p class="price">Rs 2,499</p>
            <button>Buy Now</button>
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1599599810694-b5ac4dd5c4a7">
            <h2>Psita</h2>
            <p class="price">Rs 500</p>
            <button>Buy Now</button>
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853">
            <h2>Laptop</h2>
            <p class="price">Rs 25000</p>
            <button>Buy Now</button>
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1600267165477-6d4cc741b379">
            <h2>Mobile</h2>
            <p class="price">Rs 9,999</p>
            <button>Buy Now</button>
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1599599810694-b5ac4dd5c4a7">
            <h2>Psita</h2>
            <p class="price">Rs 500</p>
            <button>Buy Now</button>
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
            <h2>Headphone</h2>
            <p class="price">Rs 2,499</p>
            <button>Buy Now</button>
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1599599810694-b5ac4dd5c4a7">
            <h2>Psita</h2>
            <p class="price">Rs 500</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>

</html>
