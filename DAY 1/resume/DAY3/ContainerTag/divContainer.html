<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div style="background-color: blueviolet;">
        <h2>Books</h2>
        <p>This is a Box of Books</p>
        <button>Buy Now</button>
    </div>

    <div style="background-color: orange;">
        <h2>Fruits</h2>
        <p>This is a Box of Fruits</p>
        <p>Add To cart</p>
    </div>

    <!-- Span Tag - It will take required amount of width size as per content -->

    <p>Good evening, How are you?</p>

    <p>Good <span style="background-color: blueviolet;">Morning</span>, Howdy?</p>

    <button>Cart 0</button>

    <button>Cart <span style="background-color: orange;">0</span></button>

</body>
</html>
